<app-navbar></app-navbar>

<div class="contact-page">
  <section class="contact-hero">
    <div class="hero-orb"></div>
    <span class="section-label">Get in Touch</span>
    <h1 class="hero-title">Contact <em class="accent">Us</em></h1>
    <p class="hero-desc">Have a question or need support? We're here to help.</p>
  </section>

  <div class="contact-grid">
    <!-- Info cards -->
    <div class="contact-info">
      <div class="info-card">
        <div class="info-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <div>
          <h4>Email Us</h4>
          <p>stucare&#64;support.com</p>
        </div>
      </div>

      <div class="info-card">
        <div class="info-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.6 3.41 2 2 0 0 1 3.55 1.25h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6 6l1.27-.89a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7a2 2 0 0 1 1.72 2.03z"/>
          </svg>
        </div>
        <div>
          <h4>Call Us</h4>
          <p>+92 300 000 0000</p>
        </div>
      </div>

      <div class="info-card">
        <div class="info-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <div>
          <h4>Location</h4>
          <p>Pakistan</p>
        </div>
      </div>

      <div class="info-card">
        <div class="info-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div>
          <h4>Working Hours</h4>
          <p>Mon – Fri, 9 AM – 6 PM</p>
        </div>
      </div>
    </div>

    <!-- Message form -->
    <div class="contact-form-panel">
      <h3 class="panel-title">Send a Message</h3>
      <form (submit)="onSubmit($event)">
        <div class="sc-form-group">
          <label>Your Name</label>
          <input type="text" placeholder="Full name" />
        </div>
        <div class="sc-form-group">
          <label>Email Address</label>
          <input type="email" placeholder="your@email.com" />
        </div>
        <div class="sc-form-group">
          <label>Subject</label>
          <input type="text" placeholder="How can we help?" />
        </div>
        <div class="sc-form-group">
          <label>Message</label>
          <textarea rows="5" placeholder="Write your message here..."></textarea>
        </div>
        <button type="submit" class="sc-btn">Send Message</button>
      </form>
    </div>
  </div>
</div>
